<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity – Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="icon">V</div>
    <div>
      <h1>Verity</h1>
      <p>Bank Marketing Data Documentation Assistant</p>
    </div>
  </div>
  <div class="nav-links">
    <a href="/">Upload</a>
    <a href="/dashboard" class="active">Dashboard</a>
    <button type="button" class="nav-btn" onclick="openSettings()">Settings</button>
  </div>
  <div class="nav-right">
    <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">☀</button>
  </div>
</nav>

<!-- MAIN APP CONTAINER -->
<div class="container" id="app">
  <!-- Filled dynamically by dashboard.js from sessionStorage results -->
  <div class="empty" id="emptyState">
    <p>No results to display yet.<br><a href="/">← Go to Upload page</a> to analyze a dataset.</p>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-head">
      <h3>Settings</h3>
      <button type="button" class="modal-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="setting-row">
      <span>Appearance Theme</span>
      <button type="button" class="setting-btn" id="modalThemeBtn" onclick="toggleTheme()">Switch to Light</button>
    </div>
    <div class="setting-row">
      <span>API Key Status</span>
      <span id="setApiKey">Checking...</span>
    </div>
    <div class="setting-row">
      <span>OpenAI Base URL</span>
      <span id="setBaseUrl" style="font-size:12px;color:var(--text-muted)">-</span>
    </div>
    <div class="setting-row">
      <span>LLM Response Cache (<span id="setCacheCount">0</span>)</span>
      <button type="button" class="setting-btn" onclick="clearCache()">Clear Cache</button>
    </div>
    <div class="setting-row">
      <span>Guardrails</span>
      <span style="font-size:12px;color:var(--text-muted)">Temp 0 · Overlap ≥ 30% · Missing &gt; 5%</span>
    </div>
    <div class="setting-msg" id="settingMsg"></div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
