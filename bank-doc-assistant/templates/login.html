<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity – Login</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">

<div class="auth-topbar">
  <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">☀</button>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">V</div>
      <h1>Bank Marketing Data Documentation Assistant</h1>
      <p>Welcome back! Sign in to continue.</p>
    </div>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="loginForm" class="auth-form" method="post" action="/login" novalidate>
      <div class="auth-field">
        <label for="loginEmail">Email address</label>
        <div class="auth-input-wrap">
          <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <div class="auth-input-wrap has-toggle">
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Show or hide password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="auth-row">
        <label class="auth-check">
          <input type="checkbox" id="rememberMe" name="remember">
          <span>Remember me</span>
        </label>
        <button type="button" class="auth-link" onclick="openForgotModal()">Forgot password?</button>
      </div>

      <button type="submit" class="btn-primary auth-submit" id="loginBtn">
        <span class="btn-label">Login</span>
        <div class="spinner" id="loginSpinner"></div>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register" class="auth-link">Create an account</a>
    </div>
  </div>
</main>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal-backdrop" id="forgotModal" onclick="if(event.target===this)closeForgotModal()">
  <div class="modal">
    <div class="modal-head">
      <h3>Reset Password</h3>
      <button type="button" class="modal-close" onclick="closeForgotModal()">&times;</button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5">
      Enter your registered email address to request password recovery instructions.
    </p>
    <form onsubmit="submitForgotPassword(event)" class="auth-form">
      <div class="auth-field">
        <label for="forgotEmail">Email address</label>
        <div class="auth-input-wrap">
          <input type="email" id="forgotEmail" placeholder="you@example.com" required>
        </div>
      </div>
      <button type="submit" class="btn-primary auth-submit">Send Reset Instructions</button>
    </form>
    <div class="setting-msg" id="forgotMsg"></div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
